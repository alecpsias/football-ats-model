name: CFB learned-rush vs Build16 first frozen paired forward grading

on:
  push:
    branches: [cfb-failure1-paired-forward-ledger-20261022]
    paths:
      - 'cfb/failure1_paired_forward.py'
      - 'cfb/test_cfb_failure1_paired_forward.py'
      - '.github/workflows/cfb-failure1-paired-forward.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  independent-paired-research:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - run: python -m pip install -r requirements-cfb.txt
      - name: Guard earliest-ever forecasts and same-snapshot pairs
        run: |
          python -m unittest cfb.test_cfb_failure1_paired_forward -v
          python -m unittest discover -s cfb -p 'test_cfb_*.py' -q
      - name: Read most recently committed original forecasts and real ESPN odds
        run: |
          git fetch origin main
          git checkout origin/main -- cfb/archive/forecasts cfb/archive/odds
      - name: Capture free currently observed final-score source
        run: python -m cfb.pipeline collect --season 2026 --out cfb_artifacts/f1_paired_source
      - name: Grade same-snapshot frozen model pair and same authentic quote
        run: |
          python -m cfb.failure1_paired_forward \
            --forecasts cfb/archive/forecasts \
            --odds cfb/archive/odds \
            --schedule cfb_artifacts/f1_paired_source/schedule.parquet \
            --manifest cfb_artifacts/f1_paired_source/manifest.json \
            --out cfb_artifacts/f1_paired_now.json
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: cfb-failure1-paired-forward-now
          path: cfb_artifacts/f1_paired_now.json
          if-no-files-found: warn

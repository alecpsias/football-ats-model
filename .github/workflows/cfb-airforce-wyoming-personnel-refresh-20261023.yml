name: Air Force Wyoming Build16 personnel refresh
on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - '.github/workflows/cfb-airforce-wyoming-personnel-refresh-20261023.yml'
permissions:
  contents: read
jobs:
  pregame:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - run: python -m pip install -r requirements-cfb.txt
      - run: python -m unittest discover -s cfb -p 'test_cfb_*.py' -q
      - run: |
          python -m cfb.pipeline collect --season 2026 --out cfb_artifacts/airforce_wyoming_personnel_snapshot
          python -m cfb.pipeline verify --snapshot cfb_artifacts/airforce_wyoming_personnel_snapshot
      - run: |
          python -m cfb.fresh_matchup --mode pregame --team-a "Air Force" --team-b Wyoming --game-id 401864525 --snapshot cfb_artifacts/airforce_wyoming_personnel_snapshot --odds cfb/_market_disabled --availability-dir cfb/availability --runs 5000 --github-run-id "$GITHUB_RUN_ID" --git-sha "$GITHUB_SHA" --out cfb_artifacts/airforce_wyoming_personnel_pregame.json
      - name: Paired same-seed 5000 draw spread comparison
        run: |
          python - <<'PY'
          import json
          from pathlib import Path
          import pandas as pd
          from cfb.pipeline import verify, iso_utc
          from cfb.fresh_matchup import histories_asof
          from cfb.failure1_learned_shadow import correction
          from cfb.mechanism_build16 import simulate_build16
          root=Path('cfb_artifacts/airforce_wyoming_personnel_snapshot')
          cap=iso_utc(verify(root)['captured_at_utc'])
          saved=json.loads(Path('cfb_artifacts/airforce_wyoming_personnel_pregame.json').read_text())
          evidence=saved.get('build16_active_personnel_evidence')
          if not isinstance(evidence,dict):raise RuntimeError('Personnel audit missing')
          future,_,hist,_=histories_asof(pd.read_parquet(root/'schedule.parquet'),
                pd.read_parquet(root/'pbp.parquet'),
                pd.read_parquet(root/'roster.parquet'),cap)
          game=future.loc[future.game_id.astype(str).eq('401864525')]
          if len(game)!=1:raise RuntimeError('No eligible pregame record')
          g=game.iloc[0];h,a=int(g.home_id),int(g.away_id)
          adj=correction(h,a,hist)
          args=dict(home_id=h,away_id=a,histories=hist,neutral=bool(g.neutral_site),
               runs=5000,seed=401864525,
               failure1_fit_margin_delta=adj['margin_delta_points'])
          rows=[]
          for spread in (4.5,5.5,6.5):
              for enabled in (False,True) if spread==5.5 else (True,):
                  payload=simulate_build16(spread_home=spread,
                    personnel_enabled=enabled,personnel_evidence=evidence if enabled else None,
                    **args)
                  x=payload.get('simulation')
                  if not x:raise RuntimeError('Simulation missing '+str(payload))
                  rows.append({'wyoming_spread':spread,'personnel_enabled':enabled,
                    'airforce_cover_raw':x['away_cover_probability_raw'],
                    'wyoming_win_raw':x['home_win_probability_raw'],
                    'airforce_score':x['mean_score_away'],'wyoming_score':x['mean_score_home'],
                    'airforce_margin':-x['mean_margin_home'],
                    'margin_sd':x['margin_standard_deviation'],'mean_total':x['mean_total'],
                    'samples':x['simulations']})
          report={'game_id':'401864525','source_snapshot':str(cap),
             'report_status':(saved.get('availability_evidence') or {}).get('status'),
             'personnel':evidence,'results':rows,'not_calibrated':True}
          print('AIRFORCE_WYOMING_PERSONNEL_PAIRED_5000')
          print(json.dumps(report,indent=2,default=str)[:44000])
          Path('cfb_artifacts/airforce_wyoming_personnel_paired.json').write_text(
                json.dumps(report,indent=2,default=str))
          PY
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: airforce-wyoming-personnel-${{ github.run_id }}
          path: |
            cfb_artifacts/airforce_wyoming_personnel_pregame.json
            cfb_artifacts/airforce_wyoming_personnel_paired.json

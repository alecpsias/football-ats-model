name: CFB Build16 joint-drive integration tests
on:
  push:
    branches: [main, cfb-joint-drive-build16-20261023]
    paths:
      - 'cfb/joint_drive_process.py'
      - 'cfb/sustainability.py'
      - 'cfb/drive_sustainability_process.py'
      - 'cfb/test_cfb_explosive_rush_tds.py'
      - 'cfb/ats_concordance.py'
      - 'cfb/fresh_matchup.py'
      - 'cfb/test_cfb_ats_concordance.py'
      - 'cfb/empirical_drive_clock.py'
      - 'cfb/game_script.py'
      - 'cfb/mechanism_build16.py'
      - 'cfb/two_way_venue.py'
      - 'cfb/test_cfb_two_way_venue.py'
      - 'cfb/research_backtest.py'
      - 'cfb/test_cfb_joint_drive_process.py'
      - '.github/workflows/cfb-joint-drive.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - run: python -m pip install -r requirements-cfb.txt
      - name: Joint-drive regression tests
        run: python -m unittest cfb.test_cfb_joint_drive_process -v
      - name: New two-way and venue 5000-draw regression
        run: python -m unittest cfb.test_cfb_two_way_venue -v
      - name: Entire CFB regression suite
        run: python -m unittest discover -s cfb -p 'test_cfb_*.py' -q

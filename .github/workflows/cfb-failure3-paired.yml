name: CFB Failure 3 explosive sustainability paired audit

on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - '.github/workflows/cfb-failure3-paired.yml'
      - 'cfb/sustainability.py'
      - 'cfb/drive_sustainability_process.py'
      - 'cfb/empirical_drive_clock.py'
      - 'cfb/test_cfb_empirical_drive_clock.py'
      - 'cfb/game_script.py'
      - 'cfb/test_cfb_failure3_possession.py'
      - 'cfb/failure3_paired.py'
      - 'cfb/test_cfb_failure3_sustainability.py'
      - 'cfb/mechanism_build16.py'
      - 'cfb/research_backtest.py'

permissions:
  contents: read

jobs:
  failure3:
    runs-on: ubuntu-latest
    timeout-minutes: 50
    steps:
      - name: Checkout exact commit
        uses: actions/checkout@v4
      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Install FREE CFB dependencies
        run: python -m pip install -r requirements-cfb.txt
      - name: Full CFB unit test suite
        run: python -m unittest discover -s cfb -p 'test_cfb_*.py' -q
      - name: Collect actual 2026 CFB source
        run: |
          mkdir -p cfb_artifacts
          python -m cfb.pipeline collect --season 2026 --out cfb_artifacts/snapshot
          python -m cfb.pipeline verify --snapshot cfb_artifacts/snapshot
      - name: Paired Build16 empirical-clock Failure 3 (160 games x 5000 each)
        run: |
          python -m cfb.failure3_paired --snapshot cfb_artifacts/snapshot \
            --out cfb_artifacts/failure3_paired_160_5000.json --max-games 160 --runs 5000
      - name: Upload results
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: failure3-paired-160-${{ github.run_id }}
          path: cfb_artifacts/failure3_paired_160_5000.json
          if-no-files-found: warn

name: Free nflverse collection and replay

on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/nflverse-free-data.yml'
      - 'ingest.py'
      - 'collect_extra_metrics.py'
      - 'test_collect_extra_metrics.py'
  workflow_dispatch:
  schedule:
    - cron: '15 11 * * 0'

permissions:
  contents: read

jobs:
  collect:
    runs-on: ubuntu-latest
    timeout-minutes: 40
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Install free dependencies
        run: pip install -r requirements-nflverse.txt
      - name: Run tests (accommodate flattened web upload)
        run: |
          mkdir -p ../examples run-metadata
          cp synthetic_matchup.json ../examples/synthetic_matchup.json
          python -m unittest discover -s . -p 'test_*.py' -v
      - name: Download 2026 nflverse data
        run: python nflverse_connector.py collect --season 2026 --out snapshots/2026/run-${{ github.run_id }}
      - name: Check source hashes and replay cutoff
        run: |
          python nflverse_connector.py verify --snapshot snapshots/2026/run-${{ github.run_id }} > run-metadata/hashes.json
          python check_snapshots.py --snapshot snapshots/2026/run-${{ github.run_id }} --cutoff '2026-10-18T12:30:00Z' --out run-metadata/pregame-eligibility.json
      - name: Collect PFR weekly advanced stats and derive penalty/kicking metrics
        run: |
          python collect_extra_metrics.py \
            --snapshot snapshots/2026/run-${{ github.run_id }} \
            --out derived-metrics/run-${{ github.run_id }}
      - name: Summarize advanced-stat coverage and source timestamp
        if: always()
        shell: bash
        run: |
          python - <<'PYCODE'
          import json, os
          from pathlib import Path
          p=Path('derived-metrics/run-${{ github.run_id }}/metrics_manifest.json')
          with open(os.environ['GITHUB_STEP_SUMMARY'],'a',encoding='utf-8') as f:
              f.write('\n## Supplementary 2026 metrics\n')
              if p.exists():
                  x=json.loads(p.read_text())
                  f.write('\n**Collection status:** '+x['status']+'\n')
                  f.write('\n**Eligible games:** '+str(x['eligible_schedule_games'])+'\n')
                  f.write('\n**PFR feed status:** '+', '.join(k+': '+v['status'] for k,v in x['pfr'].items())+'\n')
                  f.write('\n**Timestamp rule:** '+x['asof_policy']+'\n')
              else:
                  f.write('\nNo extra metrics manifest generated. Inspect prior job logs.\n')
          PYCODE
      - name: Replay Texans-Jaguars, without guessing missing data
        shell: bash
        run: |
          mkdir -p replay-results
          set +e
          python run_snapshot_ingest.py --snapshot snapshots/2026/run-${{ github.run_id }} --config ingest_config_UNVERIFIED.json --output-prefix replay-results/texans-jaguars
          rc=$?
          set -e
          echo "$rc" > replay-results/exit-code.txt
          if [ "$rc" -ne 0 ] && [ "$rc" -ne 2 ]; then exit "$rc"; fi
          if [ "$rc" -eq 2 ]; then echo 'Full model blocked by missing or late inputs, as intended.' >> "$GITHUB_STEP_SUMMARY"; fi
      - name: Report
        if: always()
        run: |
          python write_run_summary.py --snapshot snapshots/2026/run-${{ github.run_id }} --replay-audit replay-results/texans-jaguars.audit.json --output run-metadata/run-summary.md --github-summary "$GITHUB_STEP_SUMMARY"
      - name: Upload source data and audits
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: nflverse-${{ github.run_id }}
          path: |
            snapshots/
            run-metadata/
            replay-results/
            derived-metrics/
          if-no-files-found: warn
          retention-days: 30

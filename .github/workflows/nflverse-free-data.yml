name: NFL fixed baseline + ONE evolving challenger (free data)

# No paid API keys. GitHub schedules may be delayed; a forecast is emitted
# only when ALL consumed datasets have been captured before the game's kickoff.
on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/nflverse-free-data.yml'
      - 'model.py'
      - 'forecast_upcoming_core.py'
      - 'collect_injury_reports.py'
      - 'test_future_core.py'
      - 'measure_player_availability.py'
      - 'test_measure_player_availability.py'
      - 'mechanism_research.py'
      - 'test_mechanism_research.py'
      - 'evaluate_locked_forecasts.py'
      - 'nfl_stateful_candidate.py'
      - 'nfl_challenger_policy.py'
      - 'test_nfl_stateful_candidate.py'
      - 'test_nfl_forward_ledger.py'
      - 'simulation_receipt.py'
      - 'nfl_matchup_request.py'
      - 'test_simulation_receipt.py'
  issues:
    types: [opened]
  workflow_dispatch:
  schedule:
    - cron: '6 14 * * *'                # Daily morning pregame collection (UTC)
    - cron: '6 20 * * 0,1,4,5,6'      # Afternoon before common kickoff windows
    - cron: '6 23 * * 0,1,4,5,6'      # Evening refresh; future kickoffs only

permissions:
  contents: write
  issues: read

concurrency:
  group: football-ats-core-${{ github.ref }}
  cancel-in-progress: false

jobs:
  collect:
    if: ${{ github.event_name != 'issues' || (github.event.action == 'opened' && github.event.issue.title == 'NFL Matchup Request' && github.event.issue.user.login == github.repository_owner) }}
    runs-on: ubuntu-latest
    timeout-minutes: 40
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Verify owner-requested NFL matchup identity before collecting data
        if: ${{ github.event_name == 'issues' }}
        run: python nfl_matchup_request.py --event "$GITHUB_EVENT_PATH" --env-file "$GITHUB_ENV"
      - name: Install free dependencies
        run: pip install -r requirements-nflverse.txt
      - name: Verify fixed baseline and single evolving challenger
        run: |
          mkdir -p ../examples run-metadata
          cp synthetic_matchup.json ../examples/synthetic_matchup.json
          # NFL tests live at repository root; CFB has its own dedicated suite.
          python - <<'PY'
          import pathlib,unittest,sys
          names=sorted(x.stem for x in pathlib.Path('.').glob('test_*.py'))
          result=unittest.TextTestRunner(verbosity=2).run(
              unittest.defaultTestLoader.loadTestsFromNames(names))
          sys.exit(0 if result.wasSuccessful() else 1)
          PY
      - name: Resolve current NFL season and run-scoped paths
        shell: bash
        run: |
          YEAR=$(python - <<'PY'
          from datetime import datetime, timezone
          now=datetime.now(timezone.utc)
          # July-Feb NFL-year convention; do not confuse Jan/Feb with next season.
          print(now.year if now.month>=7 else now.year-1)
          PY
          )
          echo "SEASON=$YEAR" >> "$GITHUB_ENV"
          echo "SNAPSHOT=snapshots/$YEAR/run-${{ github.run_id }}" >> "$GITHUB_ENV"
          echo "EXTRA=derived-metrics/run-${{ github.run_id }}" >> "$GITHUB_ENV"
          echo "INJURIES=injury-reports/run-${{ github.run_id }}" >> "$GITHUB_ENV"
          echo "PREDICTIONS=future-predictions/run-${{ github.run_id }}" >> "$GITHUB_ENV"
      - name: Collect timestamped nflverse PBP schedule and rosters
        run: python nflverse_connector.py collect --season "$SEASON" --out "$SNAPSHOT"
      - name: Verify base hashes
        run: python nflverse_connector.py verify --snapshot "$SNAPSHOT" > run-metadata/hashes.json
      - name: Collect verified PFR pressure penalties and kicking
        run: python collect_extra_metrics.py --snapshot "$SNAPSHOT" --out "$EXTRA" --minimum-hours 6
      - name: Collect available injury report observations (nonfatal)
        run: python collect_injury_reports.py --season "$SEASON" --out "$INJURIES"
      - name: Generate frozen baseline and sole current research challenger
        run: |
          python forecast_upcoming_core.py \
            --snapshot "$SNAPSHOT" \
            --metrics-dir "$EXTRA" \
            --injuries-dir "$INJURIES" \
            --out "$PREDICTIONS" \
            --window-hours 48 --runs 5000
      - name: Create fail-closed five-thousand-run receipts for projected NFL games
        shell: bash
        run: |
          python - <<'PY'
          import json, os, subprocess
          from pathlib import Path
          directory = Path(os.environ['PREDICTIONS'])
          rows = json.loads((directory / 'index.json').read_text())['games']
          for row in rows:
              if row['status'] != 'PROJECTED_UNCALIBRATED':
                  continue
              filename = row['file']
              if filename != row['game_id'] + '.json':
                  raise ValueError('Forecast filename mismatch')
              subprocess.run([
                  'python', 'simulation_receipt.py', '--league', 'NFL',
                  '--input', str(directory / filename),
                  '--out', str(Path('run-metadata/receipts') / (row['game_id'] + '.json')),
                  '--run-id', os.environ['GITHUB_RUN_ID'],
                  '--git-sha', os.environ['GITHUB_SHA']], check=True)
          PY
      - name: Select fresh NFL matchup requested by the repository owner
        if: ${{ github.event_name == 'issues' }}
        run: |
          mkdir -p nfl/archive/requests
          python nfl_matchup_request.py \
            --predictions "$PREDICTIONS" \
            --team-a "$NFL_TEAM_A" --team-b "$NFL_TEAM_B" \
            --game-id "$NFL_GAME_ID" \
            --out "nfl/archive/requests/${GITHUB_RUN_ID}.json"
          python simulation_receipt.py \
            --league NFL \
            --input "nfl/archive/requests/${GITHUB_RUN_ID}.json" \
            --out "nfl/archive/requests/${GITHUB_RUN_ID}.proof.json" \
            --run-id "$GITHUB_RUN_ID" --git-sha "$GITHUB_SHA"
      - name: Save on-demand NFL matchup and proof as an append-only GitHub commit
        if: ${{ github.event_name == 'issues' }}
        run: |
          set -euo pipefail
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add nfl/archive/requests
          git commit -m "Archive verified NFL requested matchup ${GITHUB_RUN_ID}"
          git pull --rebase origin main
          git push origin HEAD:main
      - name: Write run status and warnings
        if: always()
        shell: bash
        run: |
          python - <<'PY'
          import os,json
          from pathlib import Path
          out=Path('run-metadata/one-challenger-summary.json')
          pred=Path(os.environ.get('PREDICTIONS','unavailable'))/'index.json'
          injury=Path(os.environ.get('INJURIES','unavailable'))/'injury_manifest.json'
          summary={'version':'0.10.0','status':'DONE' if pred.exists() else 'NO_FORECAST_INDEX',
                   'predictions':json.loads(pred.read_text()) if pred.exists() else None,
                   'injuries':json.loads(injury.read_text()) if injury.exists() else None,
                   'note':'The established NFL baseline is unchanged; only one active, evolving challenger; uncalibrated and not an ATS bet'}
          out.parent.mkdir(exist_ok=True,parents=True)
          out.write_text(json.dumps(summary,indent=2)+'\n')
          with open(os.environ['GITHUB_STEP_SUMMARY'],'a') as f:
              f.write('# NFL — locked baseline + exactly one evolving research challenger\n\n')
              if summary['predictions']:
                  x=summary['predictions'];f.write(f"**Projected:** {x['n_projected']}  **Blocked:** {x['n_blocked']}\n\n")
                  for g in x['games']:
                      f.write(f"- {g['game_id']}: {g['status']}; {g.get('reason','fair spread '+str(g.get('fair_spread_home')))}\n")
                      if g.get('status')=='PROJECTED_UNCALIBRATED':
                          f.write(f"  - Research candidate margin: {g.get('challenger_margin_home')}; NOT production or calibrated\n")
              else:f.write('No forecast index generated; inspect logs.\n')
              if summary['injuries']:
                  f.write('\nInjury feed: **'+summary['injuries']['status']+'**; NOT verified inactives.\n')
              f.write('\n**Caution:** Challenger cannot replace baseline without chronological accuracy and verified ATS market backtest. No official inactives used.\n')
          PY
      - name: Save immutable source data and pregame forecast artifact
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: football-ats-v10-${{ github.run_id }}
          path: |
            snapshots/
            derived-metrics/
            injury-reports/
            future-predictions/
            run-metadata/
            nfl/archive/requests/
          if-no-files-found: warn
          retention-days: 30

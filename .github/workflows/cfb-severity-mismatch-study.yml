name: CFB Failure 1 severe rushing mismatch research

on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  severity-paired:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - run: python -m pip install -r requirements-cfb.txt
      - name: Verify baseline invariance and optional opponent mismatch source features
        run: python -m unittest discover -s cfb -p 'test_cfb_*.py' -q
      - name: Download free complete 2026 CFB sources
        run: python -m cfb.pipeline collect --season 2026 --out cfb_artifacts/severity_snapshot
      - name: Five paired configurations with exactly 5000 simulations per game
        run: |
          python -m cfb.severity_study \
            --snapshot cfb_artifacts/severity_snapshot \
            --out cfb_artifacts/severity_result.json \
            --max-games 180 --runs 5000
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: cfb-failure1-severity-rush-study
          path: cfb_artifacts/severity_result.json
          if-no-files-found: warn

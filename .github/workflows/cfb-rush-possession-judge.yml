name: CFB rush possession 2023-frozen 540-game decision gate
on:
  push:
    branches: [cfb-possession-rush-mechanism-20261022]
    paths:
      - 'cfb/rush_possession_decision.py'
      - 'cfb/FAILURE1_RUSH_POSSESSION_2023_FROZEN.json'
      - '.github/workflows/cfb-rush-possession-judge.yml'
  workflow_dispatch:
permissions:
  contents: read
  actions: read
jobs:
  no-automatic-promotion:
    runs-on: ubuntu-latest
    timeout-minutes: 12
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - run: python -m pip install -r requirements-cfb.txt
      - uses: actions/download-artifact@v4
        with:
          name: cfb-possession-rush-2023-earlier-training
          repository: alecpsias/football-ats-model
          run-id: 39843826367
          github-token: ${{ secrets.GITHUB_TOKEN }}
          path: cfb_artifacts/training
      - name: Compare committed coefficient to original frozen training artifact
        run: |
          python - <<'PY'
          import json,pathlib
          a=json.loads(pathlib.Path('cfb/FAILURE1_RUSH_POSSESSION_2023_FROZEN.json').read_text())
          b=json.loads(pathlib.Path('cfb_artifacts/training/possession_2023_frozen_fit.json').read_text())
          assert a==b, 'Frozen 2023 fit differs from actual completed training run!'
          assert a['trained_year']==2023
          print('FIT_IMMUTABLE_VERIFIED')
          PY
      - uses: actions/download-artifact@v4
        with:
          name: cfb-possession-rushing-holdout-2024
          repository: alecpsias/football-ats-model
          run-id: 39844166211
          github-token: ${{ secrets.GITHUB_TOKEN }}
          path: cfb_artifacts/holdouts
      - uses: actions/download-artifact@v4
        with:
          name: cfb-possession-rushing-holdout-2025
          repository: alecpsias/football-ats-model
          run-id: 39844166211
          github-token: ${{ secrets.GITHUB_TOKEN }}
          path: cfb_artifacts/holdouts
      - uses: actions/download-artifact@v4
        with:
          name: cfb-possession-rushing-holdout-2026
          repository: alecpsias/football-ats-model
          run-id: 39844166211
          github-token: ${{ secrets.GITHUB_TOKEN }}
          path: cfb_artifacts/holdouts
      - name: Blind-prespecified same-seed 540-game physical sign and ATS gates
        run: |
          python -m cfb.rush_possession_decision \
            --frozen-fit cfb_artifacts/training/possession_2023_frozen_fit.json \
            --holdouts cfb_artifacts/holdouts/possession_2024_holdout.json \
                       cfb_artifacts/holdouts/possession_2025_holdout.json \
                       cfb_artifacts/holdouts/possession_2026_holdout.json \
            --out cfb_artifacts/possession_rush_decision.json
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: cfb-rush-possession-540-game-decision
          path: cfb_artifacts/possession_rush_decision.json
          if-no-files-found: warn

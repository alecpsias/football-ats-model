name: CFB free-data snapshot and schema audit

on:
  issues:
    types: [opened]
  push:
    branches: [main]
    paths:
      - '.github/workflows/cfb-free-data.yml'
      - 'cfb/**'
      - '!cfb/archive/**'
      - 'requirements-cfb.txt'
      - 'cfb/issue_request.py'

  workflow_dispatch:
    inputs:
      season:
        description: CFB season to collect (default 2026)
        required: true
        type: string
        default: '2026'
      mode:
        description: 'batch (normal run); pregame (FRESH two-team statistical model); postgame (review saved request)'
        required: true
        type: choice
        options:
          - batch
          - pregame
          - postgame
        default: batch
      team_a:
        description: 'First school, e.g. Alabama (needed for pregame/postgame)'
        required: false
        type: string
      team_b:
        description: 'Second school, e.g. Texas A&M (needed for pregame/postgame)'
        required: false
        type: string
      game_id:
        description: 'Optional ESPN game ID if the schools play more than once'
        required: false
        type: string
  schedule:
    # Mon/Wed/Fri around 12:19 UTC during college football season.
    - cron: '19 12 * 8-12 1,3,5'

permissions:
  contents: write
  issues: read

# Append-only archive writes must never cancel each other.
concurrency:
  group: cfb-archive-writes
  cancel-in-progress: false

jobs:
  cfb-snapshot:
    if: ${{ github.event_name != 'issues' }}
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - name: Checkout NFL/CFB repository
        uses: actions/checkout@v4
      - name: Configure Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Install free-data dependencies
        run: python -m pip install -r requirements-cfb.txt
      - name: Reproducible CFB unit tests
        run: python -m unittest discover -s cfb -p 'test_cfb_*.py' -v
      - name: Collect immutable 2026 source data
        env:
          CFB_SEASON: ${{ inputs.season || '2026' }}
        run: |
          set -euo pipefail
          SNAPSHOT="cfb_artifacts/snapshot_${GITHUB_RUN_ID}_${GITHUB_RUN_ATTEMPT}"
          echo "SNAPSHOT=$SNAPSHOT" >> "$GITHUB_ENV"
          python -m cfb.pipeline collect --season "$CFB_SEASON" --out "$SNAPSHOT"
          python -m cfb.pipeline verify --snapshot "$SNAPSHOT"
      - name: Audit real Parquet schemas before processing
        run: |
          set -euo pipefail
          python -m cfb.pipeline inspect --snapshot "$SNAPSHOT" --out cfb_artifacts/actual_schema.json
      - name: Audit 2026 recorded QB hurries and sacks (not charted pressure)
        run: |
          python -m cfb.disruption --snapshot "$SNAPSHOT" --out cfb_artifacts/recorded_disruption_audit.json
      - name: Generate strict pregame evidence only
        run: |
          set -euo pipefail
          python -m cfb.pipeline report --snapshot "$SNAPSHOT" --out cfb_artifacts/evidence --days 7
      - name: CFB-only retrospective margin replay
        run: |
          python -m cfb.research_backtest \
            --snapshot "$SNAPSHOT" \
            --out cfb_artifacts/historical_replay \
            --runs 1500
      - name: Diagnose CFB margin misses and test individual features
        run: |
          python -m cfb.diagnostics \
            --replay cfb_artifacts/historical_replay/margin_replay.json \
            --out cfb_artifacts/historical_replay/diagnostics.json
      - name: Freeze genuine pregame CFB research forecasts
        run: |
          python -m cfb.prospective \
            --snapshot "$SNAPSHOT" \
            --out cfb_artifacts/prospective_frozen \
            --runs 5000 --days 7 \
            --git-sha "$GITHUB_SHA" \
            --github-run-id "$GITHUB_RUN_ID"
      - name: Restore original October 20 frozen forecasts (unchanged)
        run: |
          python -m cfb.archive seed \
            --source cfb/39445851316.zip \
            --out cfb/archive/forecasts
      - name: Package frozen original forecast bytes for durable archive
        run: |
          python -m cfb.archive pack \
            --frozen cfb_artifacts/prospective_frozen \
            --out cfb/archive/forecasts
      - name: Recover valid pregame odds from the original Oct 20 captured raw ESPN bytes
        if: ${{ vars.CFB_CAPTURE_ODDS == 'true' }}
        run: |
          if test -f cfb/archive/odds/recovered/39452026663.zip; then
            python -m cfb.free_odds verify cfb/archive/odds/recovered/39452026663.zip
            echo "Previously recovered original odds retained unchanged"
          else
            python -m cfb.odds_recover \
              --original cfb/archive/odds/39452026663.zip \
              --out cfb/archive/odds/recovered/39452026663.zip
          fi
      - name: Collect freely observed ESPN spread and prices (if present)
        # Freeze actual captured free sportsbook observations for matched
        # Build16 vs Failure-1 shadow ATS research. Missing ESPN odds
        # are recorded as missing; the run must not invent a quote.
        run: |
          python -m cfb.free_odds capture \
            --forecasts cfb/archive/forecasts \
            --out cfb/archive/odds \
            --run-id "$GITHUB_RUN_ID" --days 7
      - name: Grade completed frozen games using actual observed final scores
        run: |
          python -m cfb.forward_monitor \
            --forecasts cfb/archive/forecasts \
            --odds cfb/archive/odds \
            --schedule "$SNAPSHOT/schedule.parquet" \
            --manifest "$SNAPSHOT/manifest.json" \
            --source-archive "cfb/archive/finals/${GITHUB_RUN_ID}.zip" \
            --out "cfb/archive/grades/${GITHUB_RUN_ID}.json"
          mkdir -p cfb_artifacts/forward_audit
          cp "cfb/archive/grades/${GITHUB_RUN_ID}.json" cfb_artifacts/forward_audit/latest.json
      - name: Evaluate genuine forward candidates without automatic promotion
        run: |
          python -m cfb.learn_forward \
            --grades cfb/archive/grades \
            --out "cfb/archive/learning/${GITHUB_RUN_ID}.json"
      - name: Publish append-only archives to GitHub (fails if write access absent)
        run: |
          set -euo pipefail
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add cfb/archive/forecasts cfb/archive/odds cfb/archive/finals cfb/archive/grades cfb/archive/learning
          git diff --cached --quiet && { echo "Nothing to archive"; exit 0; }
          git commit -m "Archive CFB forecasts, source-observed odds and final-score audit ${GITHUB_RUN_ID}"
          git pull --rebase origin main
          git push origin HEAD:main
      - name: Perform fresh user-requested pregame or saved-original postgame investigation
        if: ${{ github.event_name == 'workflow_dispatch' && inputs.mode != 'batch' }}
        env:
          CFB_MODE: ${{ inputs.mode }}
          CFB_TEAM_A: ${{ inputs.team_a }}
          CFB_TEAM_B: ${{ inputs.team_b }}
          CFB_GAME_ID: ${{ inputs.game_id }}
        run: |
          set -euo pipefail
          test -n "$CFB_TEAM_A" && test -n "$CFB_TEAM_B" || { echo 'Provide two team names'; exit 1; }
          python -m cfb.fresh_matchup \
            --mode "$CFB_MODE" \
            --team-a "$CFB_TEAM_A" --team-b "$CFB_TEAM_B" \
            --game-id "$CFB_GAME_ID" \
            --reviews cfb/archive/reviews \
            --runs 5000 \
            --odds cfb/_market_disabled \
            --snapshot "$SNAPSHOT" \
            --availability-dir cfb/availability \
            --github-run-id "$GITHUB_RUN_ID" --git-sha "$GITHUB_SHA" \
            --out "cfb/archive/reviews/${GITHUB_RUN_ID}.json"
          if [[ "$CFB_MODE" == "pregame" ]]; then
            python simulation_receipt.py \
              --league CFB \
              --input "cfb/archive/reviews/${GITHUB_RUN_ID}.json" \
              --out "cfb/archive/reviews/${GITHUB_RUN_ID}.proof.json" \
              --run-id "$GITHUB_RUN_ID" --git-sha "$GITHUB_SHA"
          fi
          mkdir -p cfb_artifacts/matchup_request
          cp "cfb/archive/reviews/${GITHUB_RUN_ID}.json" cfb_artifacts/matchup_request/latest.json
          cp "cfb/archive/reviews/${GITHUB_RUN_ID}.md" cfb_artifacts/matchup_request/latest.md
          if [[ "$CFB_MODE" == "pregame" ]]; then
            cp "cfb/archive/reviews/${GITHUB_RUN_ID}.proof.json" cfb_artifacts/matchup_request/proof.json
          fi
      - name: Save requested matchup review as separate append-only commit
        if: ${{ github.event_name == 'workflow_dispatch' && inputs.mode != 'batch' }}
        run: |
          set -euo pipefail
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add cfb/archive/reviews
          git commit -m "Record CFB requested ${GITHUB_RUN_ID} matchup review"
          git pull --rebase origin main
          git push origin HEAD:main
      - name: Prepare FREE pregame spread log template (not a quote)
        if: ${{ vars.CFB_CAPTURE_ODDS == 'true' }}
        run: |
          python -m cfb.market template \
            --index cfb_artifacts/evidence/index.json \
            --out cfb_artifacts/pregame_market_template.csv
      - name: Grade ATS only with supplied timestamped free-source captures
        if: ${{ vars.CFB_CAPTURE_ODDS == 'true' }}
        run: |
          python -m cfb.market grade \
            --replay cfb_artifacts/historical_replay/margin_replay.json \
            --calibration cfb_artifacts/historical_replay/calibration.json \
            --quotes cfb/quotes/pregame-2026.csv \
            --out cfb_artifacts/historical_replay/ats_audit.json
      - name: Upload checksums, schemas, and evidence for audit
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: cfb-audit-${{ github.run_id }}-${{ github.run_attempt }}
          path: cfb_artifacts/
          if-no-files-found: warn
          retention-days: 90


  requested-matchup-from-issue:
    # Only the repository owner's explicitly structured CFB issue may launch this job.
    # Other issues cannot cause a data download or repository write.
    if: ${{ github.event_name == 'issues' && github.event.action == 'opened' && github.event.issue.title == 'CFB Matchup Request' && github.event.issue.user.login == github.repository_owner }}
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - name: Checkout CFB repository
        uses: actions/checkout@v4
      - name: Configure Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Install FREE CFB dependencies
        run: python -m pip install -r requirements-cfb.txt
      - name: Verify issue matches a safe request schema
        run: |
          python -m cfb.issue_request --event "$GITHUB_EVENT_PATH" --env-file "$GITHUB_ENV"
      - name: Collect CURRENT CFB statistics
        run: |
          set -euo pipefail
          # College-football season is the prior calendar year during Jan-June.
          SEASON=$(python -c 'import datetime; n=datetime.datetime.now(datetime.timezone.utc); print(n.year if n.month >= 7 else n.year-1)')
          SNAPSHOT="cfb_artifacts/request_snapshot_${GITHUB_RUN_ID}"
          echo "SNAPSHOT=$SNAPSHOT" >> "$GITHUB_ENV"
          python -m cfb.pipeline collect --season "$SEASON" --out "$SNAPSHOT"
          python -m cfb.pipeline verify --snapshot "$SNAPSHOT"
      - name: Conduct fresh model pregame or saved-original postgame analysis
        run: |
          set -euo pipefail
          python -m cfb.fresh_matchup \
            --mode "$CFB_MODE" \
            --team-a "$CFB_TEAM_A" --team-b "$CFB_TEAM_B" \
            --game-id "$CFB_GAME_ID" \
            --snapshot "$SNAPSHOT" \
            --availability-dir cfb/availability \
            --odds cfb/_market_disabled \
            --reviews cfb/archive/reviews \
            --runs 5000 \
            --github-run-id "$GITHUB_RUN_ID" --git-sha "$GITHUB_SHA" \
            --out "cfb/archive/reviews/${GITHUB_RUN_ID}.json"
          if [[ "$CFB_MODE" == "pregame" ]]; then
            python simulation_receipt.py \
              --league CFB \
              --input "cfb/archive/reviews/${GITHUB_RUN_ID}.json" \
              --out "cfb/archive/reviews/${GITHUB_RUN_ID}.proof.json" \
              --run-id "$GITHUB_RUN_ID" --git-sha "$GITHUB_SHA"
          fi
          mkdir -p cfb_artifacts/matchup_request
          cp "cfb/archive/reviews/${GITHUB_RUN_ID}.json" cfb_artifacts/matchup_request/latest.json
          cp "cfb/archive/reviews/${GITHUB_RUN_ID}.md" cfb_artifacts/matchup_request/latest.md
          if [[ "$CFB_MODE" == "pregame" ]]; then
            cp "cfb/archive/reviews/${GITHUB_RUN_ID}.proof.json" cfb_artifacts/matchup_request/proof.json
          fi
      - name: Permanently save this requested matchup investigation
        run: |
          set -euo pipefail
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add cfb/archive/reviews
          git commit -m "Archive requested CFB ${CFB_MODE} analysis ${GITHUB_RUN_ID}"
          git pull --rebase origin main
          git push origin HEAD:main
      - name: Publish readable analysis artifact
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: cfb-request-${{ github.run_id }}
          path: cfb_artifacts/matchup_request/
          if-no-files-found: warn
          retention-days: 90

name: CFB Build16 automatic personnel activation and paired test
on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - '.github/workflows/cfb-personnel-build16-default.yml'
      - 'cfb/live_availability.py'
      - 'cfb/personnel_active.py'
      - 'cfb/test_cfb_live_personnel_build16.py'
      - 'cfb/personnel_effects.py'
      - 'cfb/fresh_matchup.py'
      - 'cfb/mechanism_build16.py'
      - 'cfb/field_special.py'
permissions:
  contents: read
jobs:
  sample-backed-personnel:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - run: python -m pip install -r requirements-cfb.txt
      - name: Compile and run whole CFB regression suite
        run: |
          python -m compileall -q cfb
          python -m unittest discover -s cfb -p 'test_cfb_*.py' -q
      - name: Fetch pregame data
        run: |
          python -m cfb.pipeline collect --season 2026 --out cfb_artifacts/personnel_build16_snapshot
          python -m cfb.pipeline verify --snapshot cfb_artifacts/personnel_build16_snapshot
      - name: Run ordinary NC State at Stanford pregame with live personnel and 5000 simulations
        run: |
          python -m cfb.fresh_matchup --mode pregame \
            --team-a "NC State" --team-b "Stanford" --game-id 401858272 \
            --snapshot cfb_artifacts/personnel_build16_snapshot \
            --odds cfb/_market_disabled --availability-dir cfb/availability \
            --runs 5000 --github-run-id "$GITHUB_RUN_ID" --git-sha "$GITHUB_SHA" \
            --out cfb_artifacts/personnel_build16_pregame.json > cfb_artifacts/personnel_build16_stdout.log
          python - <<'PY'
          import json
          x=json.load(open('cfb_artifacts/personnel_build16_pregame.json'))
          p=x.get('build16_active_personnel_evidence') or {}
          b=x.get('build16_challenger') or {}
          print('SOURCE_AND_PERSONNEL_ACTIVATION')
          print(json.dumps({'status':x.get('status'),
            'capture':x.get('availability_evidence'),
            'impact':p,
            'forecast':b.get('simulation'),
            'baseline':x.get('simulation'),
            'personnel_active_in_build16':b.get('personnel_impact_active'),
            'personnel_ppd_home':p.get('ppd_home'),
            'personnel_ppd_away':p.get('ppd_away')},indent=2,default=str)[:30000])
          PY
      - name: Paired previous Build16 versus newly applied personnel Build16 5000 draws
        run: |
          python - <<'PY'
          import json
          from pathlib import Path
          import pandas as pd
          from cfb.pipeline import verify,iso_utc
          from cfb.fresh_matchup import histories_asof
          from cfb.failure1_learned_shadow import correction
          from cfb.mechanism_build16 import simulate_build16
          root=Path('cfb_artifacts/personnel_build16_snapshot')
          cap=iso_utc(verify(root)['captured_at_utc'])
          s=pd.read_parquet(root/'schedule.parquet')
          plays=pd.read_parquet(root/'pbp.parquet')
          rost=pd.read_parquet(root/'roster.parquet')
          future,mapped,hist,_=histories_asof(s,plays,rost,cap)
          game=future.loc[future.game_id.astype(str).eq('401858272')].iloc[0]
          h,a=int(game.home_id),int(game.away_id)
          frozen=json.loads(Path('cfb_artifacts/personnel_build16_pregame.json').read_text())
          current=frozen.get('build16_active_personnel_evidence')
          if current is None:raise RuntimeError('Personnel evidence missing from main pregame')
          fitted=correction(h,a,hist)
          args=dict(home_id=h,away_id=a,histories=hist,neutral=bool(game.neutral_site),
              runs=5000,seed=401858272,spread_home=6.5,
              failure1_fit_margin_delta=fitted['margin_delta_points'])
          without=simulate_build16(**args,personnel_enabled=False)
          with_p=simulate_build16(**args,personnel_evidence=current,personnel_enabled=True)
          if not without.get('simulation') or not with_p.get('simulation'):
              raise RuntimeError('Missing 5000-run paired simulation')
          report={'runs_per_mode':5000,'seed_per_mode':401858272,
             'actual_target_result_not_used':True,'comparison_is_not_an_ATS_validation':True,
             'report_source_status':frozen['availability_evidence']['status'],
             'adjustments':current,
             'without':without['simulation'],
             'with':with_p['simulation'],
             'personnel_active':with_p.get('personnel_impact_active'),
             'difference_home_margin':round(with_p['simulation']['mean_margin_home']-
                                                  without['simulation']['mean_margin_home'],5)}
          print('PERSONNEL_PAIRED_5000')
          print(json.dumps({'runs_per_mode':5000,
             'report_source_status':report['report_source_status'],
             'adjustments':current,'without_margin':without['simulation']['mean_margin_home'],
             'with_margin':with_p['simulation']['mean_margin_home'],
             'difference_home_margin':report['difference_home_margin'],
             'without_score':(without['simulation']['mean_score_home'],without['simulation']['mean_score_away']),
             'with_score':(with_p['simulation']['mean_score_home'],with_p['simulation']['mean_score_away']),
             'personnel_active':report['personnel_active']},indent=2,default=str))
          Path('cfb_artifacts/personnel_build16_paired.json').write_text(json.dumps(report,indent=2,allow_nan=False))
          PY
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: cfb-build16-personnel-default-${{ github.run_id }}
          path: |
            cfb_artifacts/personnel_build16_pregame.json
            cfb_artifacts/personnel_build16_stdout.log
            cfb_artifacts/personnel_build16_paired.json
          if-no-files-found: warn

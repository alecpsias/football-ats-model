name: CFB actual possession clock and play-mix research

on:
  push:
    branches: [cfb-possession-clock-validation-20261022]
    paths:
      - 'cfb/clock_schema_probe.py'
      - 'cfb/clock_possession_validation.py'
      - 'cfb/clock_relationship_study.py'
      - 'cfb/test_cfb_clock_validation.py'
      - '.github/workflows/cfb-clock-validation.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  validate:
    runs-on: ubuntu-latest
    timeout-minutes: 35
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - run: python -m pip install -r requirements-cfb.txt
      - run: python -m cfb.pipeline collect --season 2026 --out cfb_artifacts/clock_snapshot
      - run: python -m cfb.clock_schema_probe --snapshot cfb_artifacts/clock_snapshot --out cfb_artifacts/clock_source_schema.json
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: cfb-possession-clock-source-probe
          path: cfb_artifacts/clock_source_schema.json
          if-no-files-found: warn

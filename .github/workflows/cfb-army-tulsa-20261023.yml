name: CFB Army at Tulsa 2026-10-23 Build16 pregame 5000 ATS
on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - '.github/workflows/cfb-army-tulsa-20261023.yml'
permissions:
  contents: read
jobs:
  pregame:
    runs-on: ubuntu-latest
    timeout-minutes: 40
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - run: python -m pip install -r requirements-cfb.txt
      - name: Full CFB regression tests
        run: python -m unittest discover -s cfb -p 'test_cfb_*.py' -q
      - name: Acquire and verify free 2026 data
        run: |
          python -m cfb.pipeline collect --season 2026 --out cfb_artifacts/army_tulsa_snapshot
          python -m cfb.pipeline verify --snapshot cfb_artifacts/army_tulsa_snapshot
      - name: Resolve scheduled Army at Tulsa fixture before kickoff
        run: |
          python - <<'PY'
          import pandas as pd,os
          s=pd.read_parquet('cfb_artifacts/army_tulsa_snapshot/schedule.parquet')
          m=(s.away_team.astype(str).str.lower().str.fullmatch('army|army west point') &
             s.home_team.astype(str).str.lower().eq('tulsa'))
          rows=s.loc[m & pd.to_datetime(s.start_date,utc=True,errors='coerce').dt.date.eq(pd.Timestamp('2026-10-23').date())]
          if len(rows)!=1:raise RuntimeError('Army at Tulsa fixture missing or ambiguous '+str(s.loc[m,['game_id','start_date','completed']].to_dict('records')))
          g=rows.iloc[0]
          if bool(g.completed):raise RuntimeError('Game already completed; do not present as pregame')
          with open(os.environ['GITHUB_ENV'],'a') as f:f.write('GAME_ID='+str(g.game_id)+'\n')
          print('FIXTURE',str(g.game_id),str(g.away_team),'at',str(g.home_team),str(g.start_date))
          PY
      - name: Freeze Army at Tulsa opponent-adjusted baseline and Build16 5000 simulations
        run: |
          python -m cfb.fresh_matchup --mode pregame \
            --team-a "Army" --team-b "Tulsa" --game-id "$GAME_ID" \
            --snapshot cfb_artifacts/army_tulsa_snapshot \
            --odds cfb/_market_disabled --availability-dir cfb/availability \
            --runs 5000 --github-run-id "$GITHUB_RUN_ID" --git-sha "$GITHUB_SHA" \
            --out cfb_artifacts/army_tulsa_pregame.json > cfb_artifacts/army_tulsa_stdout.log
          python - <<'PY'
          import json
          x=json.load(open('cfb_artifacts/army_tulsa_pregame.json'))
          b=x.get('build16_challenger') or {}
          print('ARMY_TULSA_PREKICKOFF_5000')
          print(json.dumps({'status':x.get('status'),
            'game_id':x.get('game_id'),'home':x.get('home'),'away':x.get('away'),
            'kickoff':x.get('kickoff_utc'),'generated':x.get('prediction_generated_at_utc'),
            'snapshot':x.get('source_snapshot_at_utc'),
            'prior_games_home':x.get('completed_prior_games_home'),
            'prior_games_away':x.get('completed_prior_games_away'),
            'baseline':x.get('simulation'),'build16_status':b.get('status'),'build16':b.get('simulation'),
            'rushing_audit':x.get('mandatory_rushing_audit'),
            'rushing_gate':x.get('rushing_ats_risk_gate'),
            'matchup':x.get('matchup_evidence'),'qb':x.get('quarterback_participation'),
            'chain':b.get('situational_chain_evidence'),
            'redzone_kicking':b.get('redzone_kicking_evidence'),
            'availability':x.get('availability_evidence'),'missing':x.get('missing_statistical_fields')
            },indent=2,default=str)[:75000])
          PY
      - name: Same-seed ATS sensitivity at Tulsa -1.5 and -2.5
        run: |
          python - <<'PY'
          import json,os
          import pandas as pd
          from pathlib import Path
          from cfb.pipeline import verify,iso_utc
          from cfb.fresh_matchup import histories_asof
          from cfb.mechanism_build16 import simulate_build16
          from cfb.failure1_learned_shadow import correction
          root=Path('cfb_artifacts/army_tulsa_snapshot')
          cutoff=iso_utc(verify(root)['captured_at_utc'])
          s=pd.read_parquet(root/'schedule.parquet')
          p=pd.read_parquet(root/'pbp.parquet')
          r=pd.read_parquet(root/'roster.parquet')
          future,_,hist,_=histories_asof(s,p,r,cutoff)
          target=future.loc[future.game_id.astype(str).eq(os.environ['GAME_ID'])]
          if len(target)!=1:raise RuntimeError('Not one pregame fixture')
          g=target.iloc[0];hid,aid=int(g.home_id),int(g.away_id)
          rush=correction(hid,aid,hist)
          args=dict(home_id=hid,away_id=aid,histories=hist,neutral=bool(g.neutral_site),
            runs=5000,seed=int(g.game_id)%(2**32),
            failure1_fit_margin_delta=rush['margin_delta_points'])
          report={'game_id':os.environ['GAME_ID'],'captured_at':str(cutoff),
            'source_spread_quoted_externally_not_timestamp_archived':True,
            'simulated_cover_not_calibrated':True,'spreads':[]}
          for spread in (-1.5,-2.5,1.5):
            z=simulate_build16(spread_home=spread,**args)
            x=z.get('simulation')
            if x is None:raise RuntimeError('Build16 projection unavailable: '+str(z))
            report['spreads'].append({'tulsa_spread':spread,
               'army_cover_raw':x['away_cover_probability_raw'],
               'tulsa_cover_raw':x['home_cover_probability_raw'],
               'home_win_raw':x['home_win_probability_raw'],
               'tulsa_mean_score':x['mean_score_home'],
               'army_mean_score':x['mean_score_away'],
               'tulsa_margin':x['mean_margin_home'],
               'total':x['mean_total'],'spread_percentiles':x['margin_p10_p50_p90'],
               'runs':x['simulations'],'seed':x['seed']})
          print('ARMY_TULSA_ATS_5000')
          print(json.dumps(report,indent=2))
          Path('cfb_artifacts/army_tulsa_ats.json').write_text(json.dumps(report,indent=2))
          PY
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: cfb-army-tulsa-frozen-${{ github.run_id }}
          path: |
            cfb_artifacts/army_tulsa_pregame.json
            cfb_artifacts/army_tulsa_pregame.md
            cfb_artifacts/army_tulsa_stdout.log
            cfb_artifacts/army_tulsa_ats.json
          if-no-files-found: warn

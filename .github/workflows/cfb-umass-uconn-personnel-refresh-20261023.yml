name: CFB UMass UConn refreshed personnel Build16 5000 pregame
on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - '.github/workflows/cfb-umass-uconn-personnel-refresh-20261023.yml'
permissions:
  contents: read
jobs:
  pregame-personnel-refresh:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Free CFB dependencies
        run: python -m pip install -r requirements-cfb.txt
      - name: Regressions before pregame investigation
        run: |
          python -m compileall -q cfb
          python -m unittest discover -s cfb -p 'test_cfb_*.py' -q
      - name: Capture source-verified 2026 games
        run: |
          python -m cfb.pipeline collect --season 2026 --out cfb_artifacts/umass_uconn_personnel_snapshot
          python -m cfb.pipeline verify --snapshot cfb_artifacts/umass_uconn_personnel_snapshot
      - name: Guard against target game already completed
        run: |
          python - <<'PY'
          import pandas as pd
          s=pd.read_parquet('cfb_artifacts/umass_uconn_personnel_snapshot/schedule.parquet')
          target=s.loc[s.game_id.astype(str).eq('401861965')]
          if len(target)!=1:raise RuntimeError('UMass UConn fixture not unique')
          row=target.iloc[0]
          if bool(row.completed):raise RuntimeError('UMass UConn already completed: retrospective run prohibited')
          if 'Massachusetts' not in str(row.away_team) or 'UConn' not in str(row.home_team):
              raise RuntimeError('Wrong game IDs')
          print('TARGET',row.game_id,row.away_team,row.home_team,str(row.start_date))
          PY
      - name: Generate new 5000-run CFB baseline and personnel-adjusted Build16
        run: |
          python -m cfb.fresh_matchup --mode pregame \
            --team-a Massachusetts --team-b UConn --game-id 401861965 \
            --snapshot cfb_artifacts/umass_uconn_personnel_snapshot \
            --odds cfb/_market_disabled --availability-dir cfb/availability \
            --runs 5000 --github-run-id "$GITHUB_RUN_ID" --git-sha "$GITHUB_SHA" \
            --out cfb_artifacts/umass_uconn_personnel_pregame.json > cfb_artifacts/umass_uconn_personnel_stdout.log
          python - <<'PY'
          import json
          x=json.load(open('cfb_artifacts/umass_uconn_personnel_pregame.json'))
          b=x.get('build16_challenger') or {}
          audit=x.get('build16_active_personnel_evidence') or {}
          print('UMASS_UCONN_PERSONNEL_REFRESH_5000')
          print(json.dumps({'source_snapshot':x.get('source_snapshot_at_utc'),
              'forecast_created':x.get('prediction_generated_at_utc'),
              'game_id':x.get('game_id'),'baseline':x.get('simulation'),
              'personnel_challenger':b.get('simulation'),
              'personnel_evidence':audit,
              'quarterback_replacement_evidence':x.get('empirical_qb_replacement_evidence'),
              'personnel_active_in_engine':b.get('personnel_impact_active'),
              'capture':x.get('availability_evidence'),
              'matched_rush_screen':x.get('mandatory_rushing_audit'),
              'matched_early_third_chain':b.get('situational_chain_evidence'),
              'matched_rz_kicker':b.get('redzone_kicking_evidence'),
              'rushing_gate':x.get('rushing_ats_risk_gate'),
              'missing':x.get('missing_statistical_fields')},
               indent=2,default=str)[:100000])
          PY
      - name: Same seed exact 5000-draw personnel versus previous Build16 at UConn -14.5 and -16.5
        run: |
          python - <<'PY'
          import json
          from pathlib import Path
          import pandas as pd
          from cfb.pipeline import verify,iso_utc
          from cfb.fresh_matchup import histories_asof
          from cfb.failure1_learned_shadow import correction
          from cfb.mechanism_build16 import simulate_build16
          root=Path('cfb_artifacts/umass_uconn_personnel_snapshot')
          cutoff=iso_utc(verify(root)['captured_at_utc'])
          saved=json.loads(Path('cfb_artifacts/umass_uconn_personnel_pregame.json').read_text())
          evidence=saved['build16_active_personnel_evidence']
          sched=pd.read_parquet(root/'schedule.parquet')
          pbp=pd.read_parquet(root/'pbp.parquet')
          roster=pd.read_parquet(root/'roster.parquet')
          future,_,histories,_=histories_asof(sched,pbp,roster,cutoff)
          g=future.loc[future.game_id.astype(str).eq('401861965')]
          if len(g)!=1:raise RuntimeError('No unique prospective record')
          g=g.iloc[0];h,a=int(g.home_id),int(g.away_id)
          rush=correction(h,a,histories)
          args=dict(home_id=h,away_id=a,histories=histories,
            neutral=bool(g.neutral_site),runs=5000,seed=401861965,
            failure1_fit_margin_delta=rush['margin_delta_points'])
          report={'fixture':'UMass at UConn','run_id':str(g.game_id),
            'source_captured_at':saved['availability_evidence'].get('captured_at_utc'),
            'source_status':saved['availability_evidence'].get('status'),
            'personnel_evidence':evidence,'samples_per_variant':5000,
            'simulations_are_uncalibrated':True,'no_target_game_results':True,'results':[]}
          for spread in (-14.5,-16.5):
            x=simulate_build16(spread_home=spread,
              personnel_enabled=True,personnel_evidence=evidence,**args)
            sim=x.get('simulation')
            if sim is None:raise RuntimeError('No personnel Build16 simulations at '+str(spread))
            report['results'].append({'uconn_spread':spread,'model':'ACTIVE_PERSONNEL',
              'umass_cover':sim['away_cover_probability_raw'],
              'uconn_cover':sim['home_cover_probability_raw'],
              'uconn_win':sim['home_win_probability_raw'],
              'umass_points':sim['mean_score_away'],
              'uconn_points':sim['mean_score_home'],
              'uconn_margin':sim['mean_margin_home'],
              'total':sim['mean_total'],
              'margin_p10_p50_p90':sim['margin_p10_p50_p90'],
              'runs':sim['simulations']})
          legacy=simulate_build16(spread_home=-14.5,
            personnel_enabled=False,**args)
          sim=legacy.get('simulation')
          if not sim:raise RuntimeError('No legacy Build16 comparison')
          report['results'].append({'uconn_spread':-14.5,
            'model':'PERSONNEL_OFF_REFERENCE','umass_cover':sim['away_cover_probability_raw'],
            'uconn_cover':sim['home_cover_probability_raw'],
            'uconn_win':sim['home_win_probability_raw'],
            'umass_points':sim['mean_score_away'],
            'uconn_points':sim['mean_score_home'],
            'uconn_margin':sim['mean_margin_home'],
            'total':sim['mean_total'],
            'margin_p10_p50_p90':sim['margin_p10_p50_p90'],
            'runs':sim['simulations']})
          # Additional prospective QB switch based on measured past QB EPA.
          # A questionable QB does NOT count as verified OUT; this is a
          # separate conditional stress case, never a locked lineup forecast.
          import copy
          qb_evidence=(saved.get('empirical_qb_replacement_evidence') or {}).get('away') or {}
          qbs=qb_evidence.get('scenario') or {}
          report['quarterback_condition']={'status':qb_evidence.get('status'),
             'reference':qbs.get('reference_qb'),'candidate':qbs.get('candidate_qb'),
             'candidate_confirmed':False,
             'estimated_ppd_delta':qbs.get('estimated_change_in_points_per_drive')}
          if qb_evidence.get('status')=='EMPIRICAL_CONDITIONAL_SCENARIO_UNCALIBRATED':
              ev=copy.deepcopy(evidence)
              val=float(qbs['estimated_change_in_points_per_drive'])
              ev['away']['applied_ppd']=float(ev['away'].get('applied_ppd',0.))+val
              ev['ppd_away']=ev['away']['applied_ppd']
              ev['status']='ACTIVE'
              scenario=simulate_build16(spread_home=-14.5,
                 personnel_enabled=True,personnel_evidence=ev,**args)
              z=scenario.get('simulation')
              if z is None:raise RuntimeError('QB condition did not simulate')
              report['quarterback_condition']['conditional_only']={
                 'umass_cover_plus_14_5_raw':z['away_cover_probability_raw'],
                 'uconn_win_raw':z['home_win_probability_raw'],
                 'umass_score':z['mean_score_away'],
                 'uconn_score':z['mean_score_home'],
                 'uconn_margin':z['mean_margin_home'],
                 'sample_runs':z['simulations']}
          print('UMASS_UCONN_NEW_PERSONNEL_SPREAD_PAIRED')
          print(json.dumps(report,indent=2,default=str)[:65000])
          Path('cfb_artifacts/umass_uconn_personnel_paired.json').write_text(json.dumps(report,indent=2,default=str))
          PY
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: umass-uconn-live-personnel-${{ github.run_id }}
          path: |
            cfb_artifacts/umass_uconn_personnel_pregame.json
            cfb_artifacts/umass_uconn_personnel_stdout.log
            cfb_artifacts/umass_uconn_personnel_paired.json
          if-no-files-found: warn

name: CFB rushing-interaction research unit checks

on:
  push:
    branches: [cfb-rushing-interaction-research-20261022]
    paths:
      - 'cfb/**'
      - '.github/workflows/cfb-rush-research-check.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - run: python -m pip install -r requirements-cfb.txt
      - run: python -m unittest discover -s cfb -p 'test_cfb_*.py' -v
